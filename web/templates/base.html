<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t('site_title') }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="{{ lang_url('home') }}">
    <span class="display wm-latin">Zohar</span>
    <span class="heb wm-heb" lang="he" dir="rtl">זֹהַר</span>
    <span class="wm-sub">Symbols · Símbolos</span>
  </a>
  <nav class="site-nav">
    <a href="{{ lang_url('home') }}">{{ t('nav_symbols') }}</a>
    <a href="{{ lang_url('tree') }}">{{ t('nav_sefirot') }}</a>
    <a href="{{ lang_url('passage', pid=first_passage_id) }}">{{ t('nav_read') }}</a>
    <a href="{{ lang_url('ask') }}">{{ t('nav_ask') }}</a>
    <a href="{{ lang_url('scholars') }}">{{ t('nav_scholars') }}</a>
  </nav>
  <div class="lang-switch">
    <a class="lang-btn{% if lang == 'en' %} active{% endif %}" href="{{ switch_url('en') }}" hreflang="en">{{ t('lang_en') }}</a>
    <a class="lang-btn{% if lang == 'es' %} active{% endif %}" href="{{ switch_url('es') }}" hreflang="es">{{ t('lang_es') }}</a>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% include "_footer.html" %}
</body>
</html>

<!doctype html>
<html lang="{{ lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}{{ t('site_title') }}{% endblock %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Frank+Ruhl+Libre:wght@400;500;700&family=Noto+Rashi+Hebrew:wght@400;500&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
<script>try{var f=localStorage.getItem('hebfont');if(f==='rashi')document.documentElement.dataset.hebfont=f;}catch(e){}</script>
<script src="{{ url_for('static', filename='app.js') }}" defer></script>
<link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='favicon.svg') }}">
</head>
<body>
<header class="site-header">
  <a class="wordmark" href="{{ lang_url('home') }}">
    <img class="wm-mark" src="{{ url_for('static', filename='logo.svg') }}" alt="" width="34" height="34">
    <span class="display wm-latin">Zohar</span>
    <span class="heb wm-heb" lang="he" dir="rtl">זֹהַר</span>
  </a>
  <nav class="site-nav" aria-label="{{ t('nav_site') }}">
    <a href="{{ lang_url('home') }}">{{ t('nav_symbols') }}</a>
    <a href="{{ lang_url('tree') }}">{{ t('nav_sefirot') }}</a>
    <a href="{{ lang_url('passage', pid=first_passage_id) }}">{{ t('nav_read') }}</a>
    <a href="{{ lang_url('ask') }}">{{ t('nav_ask') }}</a>
    <a href="{{ lang_url('scholars') }}">{{ t('nav_scholars') }}</a>
  </nav>
  <div class="lang-switch">
    <a class="lang-btn{% if lang == 'en' %} active{% endif %}" href="{{ switch_url('en') }}" hreflang="en">{{ t('lang_en') }}</a>
    <a class="lang-btn{% if lang == 'es' %} active{% endif %}" href="{{ switch_url('es') }}" hreflang="es">{{ t('lang_es') }}</a>
  </div>
  <div class="lang-switch font-pick" role="group" aria-label="{{ t('font_label') }}" hidden>
    <button type="button" class="lang-btn" data-font="frank" aria-pressed="true"><span class="fp-alef fp-frank" lang="he">א</span>{{ t('font_standard') }}</button>
    <button type="button" class="lang-btn" data-font="rashi" aria-pressed="false"><span class="fp-alef fp-rashi" lang="he">א</span>Rashi</button>
  </div>
</header>
<main>
{% block content %}{% endblock %}
</main>
{% include "_footer.html" %}
</body>
</html>

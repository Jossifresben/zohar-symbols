{% extends "base.html" %}
{% block title %}{{ t('not_found_title') }} · Zohar{% endblock %}
{% block content %}
<section class="not-found">
  <h1 class="display">{{ t('not_found_title') }}</h1>
  <p class="intro">{{ t('node_not_found') }}</p>
  <ul class="node-list">
  {%- for nid in node_ids %}
    <li><a href="{{ lang_url('node', nid=nid) }}">{{ t('node_' ~ nid) }}</a></li>
  {%- endfor %}
  </ul>
  <p><a href="{{ lang_url('home') }}">{{ t('back_home') }}</a></p>
</section>
{% endblock %}

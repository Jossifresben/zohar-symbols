{% extends "base.html" %}
{% block content %}
<section class="not-found">
  <p class="intro">{{ t('node_not_found') }}</p>
  <ul class="node-list">
  {%- for nid in node_ids %}

  {%- endfor %}
  </ul>
</section>
{% endblock %}

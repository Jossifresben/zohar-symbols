{% extends "base.html" %}
{% block title %}{{ t('tree_title') }} · Zohar{% endblock %}
{% block content %}
<section class="tree-page">
  <h1 class="display">{{ t('tree_title') }}</h1>
  <figure class="tree-figure">
    {% include "_tree.svg" %}
    <figcaption class="muted"><span class="tree-legend">{{ t('tree_other_side') }}</span><span class="tree-prov">{{ t('tree_provenance') }}</span></figcaption>
  </figure>
  <ul class="sr-only">
  {%- for nid in node_ids %}
    <li><a href="{{ lang_url('node', nid=nid) }}">{{ t('node_' ~ nid) }}</a></li>
  {%- endfor %}
  </ul>
</section>
{% endblock %}
